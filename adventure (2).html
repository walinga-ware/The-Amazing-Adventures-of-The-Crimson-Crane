<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Amazing Adventures of The Crimson Crane!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #fdf6ec;
    --warm-white: #fefaf4;
    --brown: #5c3d2e;
    --amber: #c8842a;
    --amber-light: #e8a84a;
    --sage: #7a9e7e;
    --blush: #e8c4b8;
    --text: #3a2a1e;
    --text-light: #7a6a5e;
    --shadow: rgba(92,61,46,0.12);
  }

  html, body {
    min-height: 100%;
    background: var(--cream);
    font-family: 'Lora', Georgia, serif;
    color: var(--text);
  }

  body {
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(200,132,42,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(122,158,126,0.10) 0%, transparent 60%);
    min-height: 100vh;
  }

  /* ── COVER SCREEN ── */
  #cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    gap: 1.5rem;
  }

  .cover-ornament {
    font-size: 2.8rem;
    line-height: 1;
    filter: drop-shadow(0 2px 8px rgba(200,132,42,0.3));
  }

  .cover-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2rem, 8vw, 3.2rem);
    font-weight: 700;
    color: var(--brown);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .cover-subtitle {
    font-style: italic;
    color: var(--text-light);
    font-size: 1.05rem;
    max-width: 28ch;
    line-height: 1.7;
  }

  .cover-divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    border: none;
  }

  .btn-start {
    margin-top: 0.5rem;
    padding: 0.9rem 2.5rem;
    background: var(--brown);
    color: var(--cream);
    border: none;
    border-radius: 60px;
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(92,61,46,0.25);
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .btn-start:hover { background: var(--amber); box-shadow: 0 6px 24px rgba(200,132,42,0.35); transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }

  /* ── GAME SCREEN ── */
  #game { display: none; }

  .page-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 5rem;
  }

  /* breadcrumb / progress */
  .progress-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0 0.5rem;
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .progress-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber-light);
    flex-shrink: 0;
  }

  /* scene card */
  .scene-card {
    background: var(--warm-white);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 40px var(--shadow), 0 2px 8px rgba(0,0,0,0.04);
    margin-top: 0.75rem;
    animation: fadeUp 0.45s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* image area */
  .scene-image-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #f0e6d8 0%, #e8d5c0 100%);
    position: relative;
    overflow: hidden;
  }

  .scene-image-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }



  /* text body */
  .scene-body {
    padding: 1.5rem 1.5rem 1rem;
  }

  .scene-chapter {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--amber);
    font-family: 'Lora', serif;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }

  .scene-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--brown);
    line-height: 1.25;
    margin-bottom: 0.9rem;
  }

  .scene-text {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--text);
  }

  .scene-text p + p { margin-top: 0.85rem; }

  /* choices */
  .choices-wrap {
    padding: 0 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .choices-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-light);
    margin-bottom: 0.1rem;
    padding-left: 0.1rem;
  }

  .choice-btn {
    width: 100%;
    padding: 0.9rem 1.1rem;
    background: var(--cream);
    border: 1.5px solid rgba(92,61,46,0.14);
    border-radius: 12px;
    text-align: left;
    font-family: 'Lora', serif;
    font-size: 0.97rem;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    line-height: 1.45;
  }
  .choice-btn:hover {
    background: var(--warm-white);
    border-color: var(--amber-light);
    box-shadow: 0 3px 14px rgba(200,132,42,0.15);
    transform: translateX(3px);
  }
  .choice-btn:active { transform: translateX(1px); }

  .choice-arrow {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--amber-light);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    font-style: normal;
  }

  /* ending card */
  .ending-card {
    margin-top: 1rem;
    padding: 1.5rem;
    background: linear-gradient(135deg, #f7ede0, #efdfd0);
    border-radius: 16px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }
  .ending-icon { font-size: 2.5rem; margin-bottom: 0.6rem; }
  .ending-msg {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--brown);
    font-style: italic;
    margin-bottom: 1.2rem;
  }

  .btn-restart {
    padding: 0.75rem 2rem;
    background: var(--brown);
    color: var(--cream);
    border: none;
    border-radius: 50px;
    font-family: 'Lora', serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s;
  }
  .btn-restart:hover { background: var(--amber); transform: translateY(-1px); }

</style>
</head>
<body>

<!-- ══════════ COVER ══════════ -->
<div id="cover">
  <div class="cover-ornament">🚂🏗️</div>
  <h1 class="cover-title">The Amazing Adventures of The Crimson Crane!</h1>
  <hr class="cover-divider">
  <p class="cover-subtitle">Faster than a runaway freight train! Smarter than a five-letter puzzle! A superhero adventure starring YOU!</p>
  <button class="btn-start" onclick="startGame()">Begin the Adventure →</button>
</div>

<!-- ══════════ GAME ══════════ -->
<div id="game">
  <div class="page-wrap">
    <div class="progress-bar">
      <div class="progress-dot"></div>
      <span id="progress-text">Chapter 1</span>
    </div>
    <div id="scene-container"></div>
  </div>
</div>

let story = JSON.parse(JSON.stringify(DEFAULT_STORY));

function getPage(id) {
  return story.find(p => p.id === id);
}

// ══════════════════════════════════════════════
//  COVER → GAME
// ══════════════════════════════════════════════
function startGame() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  showPage('start');
}

// ══════════════════════════════════════════════
//  RENDER PAGE
// ══════════════════════════════════════════════
function showPage(pageId) {
  const page = getPage(pageId);
  if (!page) return;

  const container = document.getElementById('scene-container');
  document.getElementById('progress-text').textContent = page.chapter || '';

  // Build paragraphs
  const paras = page.text.split('\n').filter(Boolean)
    .map(p => `<p>${p}</p>`).join('');

  // Image: use svg field if present, else a simple placeholder
  const imageHTML = page.svg
    ? `<div class="scene-image-wrap">${page.svg}</div>`
    : `<div class="scene-image-wrap"><svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f9e8d0"/><stop offset="100%" stop-color="#fdf6ec"/></linearGradient></defs><rect width="800" height="450" fill="url(#bg)"/><text x="400" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#7a6a5e" opacity="0.6">✦ ${page.title} ✦</text></svg></div>`;

  const sceneCard = page.svg
    ? `<div class="scene-card">
      <div class="scene-body">
        <div class="scene-chapter">${page.chapter || ''}</div>
        <div class="scene-title">${page.title}</div>
        <div class="scene-text">${paras}</div>
      </div>
      ${imageHTML}
    </div>`
    : `<div class="scene-card">
      <div class="scene-body">
        <div class="scene-chapter">${page.chapter || ''}</div>
        <div class="scene-title">${page.title}</div>
        <div class="scene-text">${paras}</div>
      </div>
    </div>`;

  // Choices or ending
  let choicesHTML = '';
  if (page.choices && page.choices.length > 0) {
    const btns = page.choices.map(c => `
      <button class="choice-btn" onclick="showPage('${c.next}')">
        <span class="choice-arrow">›</span>
        ${c.label}
      </button>
    `).join('');
    choicesHTML = `
      <div class="choices-wrap">
        <div class="choices-label"></div>
        ${btns}
      </div>`;
  } else {
    choicesHTML = `
      <div style="padding:0 1.25rem 1.25rem">
        <div class="ending-card">
          <div class="ending-icon">🦸🏻</div>
          <div class="ending-msg">${page.ending || 'The End.'}</div>
          <button class="btn-restart" onclick="showPage('start')">Read Again ↺</button>
        </div>
      </div>`;
  }

  container.innerHTML = `
    ${sceneCard}
    ${choicesHTML}
  `;

  // Fix SVG sizing
  const svg = container.querySelector('.scene-image-wrap svg');
  if (svg) { svg.style.width = '100%'; svg.style.height = '100%'; svg.style.display = 'block'; }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
