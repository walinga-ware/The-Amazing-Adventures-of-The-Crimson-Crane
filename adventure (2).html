    --blush: #e8c4b8;

    --text-light: #7a6a5e;
    --shadow: rgba(92,61,46,0.12);
  }

    min-height: 100%;

    font-family: 'Lora', Georgia, serif;
    color: var(--text);
  }

  body {
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(200,132,42,0.08) 0%, transparent 60%),

  }

    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    gap: 1.5rem;
  }

    font-size: 2.8rem;
    line-height: 1;
    filter: drop-shadow(0 2px 8px rgba(200,132,42,0.3));
  }

    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2rem, 8vw, 3.2rem);
    font-weight: 700;
    color: var(--brown);

    font-size: 1.05rem;

    background: var(--brown);

    max-width: 520px;

    padding: 1.5rem 1.25rem 5rem;

    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0 0.5rem;
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.06em;
    text-transform: uppercase;

    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber-light);
    flex-shrink: 0;

// ══════════════════════════════════════════════
//  COMIC BOOK TEXT RENDERER
//
//  Markup tags supported in story text:
//    [sfx]WEE-OOO![/sfx]          → yellow/red star-burst SFX
//    [villain]THE PHANTOM...[/villain] → purple villain reveal block
//    [radio]"Message..."[/radio]   → dark radio transmission box
//    [bubble]"Speech..."[/bubble]  → left speech bubble
//    [bubble.right]"..."[/bubble]  → right (hero) speech bubble
//    [caption]Atmosphere...[/caption] → yellow caption strip
//    [em]WORD[/em]                 → big red inline emphasis
// ══════════════════════════════════════════════
function comicify(text) {
  // First escape any raw HTML that shouldn't be there
  // Then process our custom tags

  // Split into paragraphs first
  const lines = text.split('\n').filter(Boolean);

  return lines.map(line => {
    // Check if the whole line is a block-level comic tag
    const villainMatch = line.match(/^\[villain\](.*?)\[\/villain\]$/s);
    if (villainMatch) return `<div class="comic-villain">${villainMatch[1]}</div>`;

    const radioMatch = line.match(/^\[radio\](.*?)\[\/radio\]$/s);
    if (radioMatch) return `<div class="comic-radio">${radioMatch[1]}</div>`;

    const captionMatch = line.match(/^\[caption\](.*?)\[\/caption\]$/s);
    if (captionMatch) return `<div class="comic-caption">${captionMatch[1]}</div>`;

    const bubbleRightMatch = line.match(/^\[bubble\.right\](.*?)\[\/bubble\]$/s);
    if (bubbleRightMatch) return `<div class="comic-bubble-wrap right"><div class="comic-bubble">${bubbleRightMatch[1]}</div></div>`;

    const bubbleMatch = line.match(/^\[bubble\](.*?)\[\/bubble\]$/s);
    if (bubbleMatch) return `<div class="comic-bubble-wrap"><div class="comic-bubble">${bubbleMatch[1]}</div></div>`;

    // Inline replacements within a normal paragraph
    let result = line;
    result = result.replace(/\[sfx\](.*?)\[\/sfx\]/g, (_, w) => `<span class="comic-sfx">${w}</span>`);
    result = result.replace(/\[em\](.*?)\[\/em\]/g, (_, w) => `<span class="comic-em">${w}</span>`);
    return `<p>${result}</p>`;
  }).join('');
}

function startGame() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  showPage('start');
}

// ══════════════════════════════════════════════
//  RENDER PAGE
// ══════════════════════════════════════════════
function showPage(pageId) {
  const page = getPage(pageId);
  if (!page) return;

  const container = document.getElementById('scene-container');
  document.getElementById('progress-text').textContent = page.chapter || '';

  const comicHTML = comicify(page.text);

  const imageHTML = page.svg
    ? `<div class="scene-image-wrap">${page.svg}</div>`
    : `<div class="scene-image-wrap"><svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f9e8d0"/><stop offset="100%" stop-color="#fdf6ec"/></linearGradient></defs><rect width="800" height="450" fill="url(#bg)"/><text x="400" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#7a6a5e" opacity="0.6">✦ ${page.title} ✦</text></svg></div>`;

  const sceneCard = page.svg
    ? `<div class="scene-card">
        <div class="scene-body">
          <div class="scene-chapter">${page.chapter || ''}</div>
          <div class="scene-title">${page.title}</div>
          <div class="scene-text">${comicHTML}</div>
        </div>
        ${imageHTML}
      </div>`
    : `<div class="scene-card">
        <div class="scene-body">
          <div class="scene-chapter">${page.chapter || ''}</div>
          <div class="scene-title">${page.title}</div>
          <div class="scene-text">${comicHTML}</div>
        </div>
      </div>`;

  let choicesHTML = '';
  if (page.choices && page.choices.length > 0) {
    const btns = page.choices.map(c => `
      <button class="choice-btn" onclick="showPage('${c.next}')">
        <span class="choice-arrow">›</span>
        ${c.label}
      </button>
    `).join('');
    choicesHTML = `
      <div class="choices-wrap">
        <div class="choices-label"></div>
        ${btns}
      </div>`;
  } else {
    choicesHTML = `
      <div style="padding:0 1.25rem 1.25rem">
        <div class="ending-card">
          <div class="ending-icon">🦸🏻</div>
          <div class="ending-msg">${page.ending || 'The End.'}</div>
          <button class="btn-restart" onclick="showPage('start')">Read Again ↺</button>
        </div>
      </div>`;
  }

  container.innerHTML = `${sceneCard}${choicesHTML}`;

  const svg = container.querySelector('.scene-image-wrap svg');
  if (svg) { svg.style.width = '100%'; svg.style.height = '100%'; svg.style.display = 'block'; }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
